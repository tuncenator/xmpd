# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Version consistency check
  - repo: local
    hooks:
      - id: check-version-sync
        name: Check version consistency
        entry: scripts/check_version_sync.sh
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|xmpd/__init__\.py)$

  # Use the same locked tools and package scope as scripts/check.sh and CI.
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (locked)
        entry: uv run --locked --extra dev ruff check xmpd/
        language: system
        pass_filenames: false
        files: ^(xmpd/.*\.py|pyproject\.toml|uv\.lock)$
      - id: mypy
        name: Mypy (locked)
        entry: uv run --locked --extra dev mypy xmpd/
        language: system
        pass_filenames: false
        files: ^(xmpd/.*\.py|pyproject\.toml|uv\.lock)$

  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']
